services:
  - type: web
    name: game-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: / 
    autoDeploy: true
    envVars:
      - key: VITE_BACKEND_URL
        value: https://{{serviceName}}.onrender.com
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
